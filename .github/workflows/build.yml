name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 与 global.json 一致；那里固定了 SDK 版本并启用 Microsoft.Testing.Platform 运行器。
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore Dougong.slnx

      - name: Build
        run: dotnet build Dougong.slnx -c Release --no-restore

      # 测试栈是 xUnit v3 + Microsoft.Testing.Platform。
      # 不能用 VSTest 的 `--logger "console;verbosity=normal"`：MTP 不接受该参数，
      # 表现为「Zero tests ran」+ Handshake failures（退出码 5）——
      # 看起来像测试挂了，实际一个测试都没跑起来。
      # MTP 的等价参数是 `--output Detailed`。
      - name: Test
        run: dotnet test Dougong.slnx -c Release --no-build --output Detailed

      # 偶发失败已被观察到一次，重试一次以区分 flaky 与真失败；
      # 重试仍失败则说明是真实回归。
      - name: Test (retry on flake)
        if: failure()
        run: dotnet test Dougong.slnx -c Release --no-build --output Detailed

      # 这一步同时做两件事：验证能打包，以及 **API 兼容检查**。
      # Dougong.Kernel 与 Dougong.Agent 启用了 EnablePackageValidation，
      # 与 artifacts/baseline/ 下的基线包比对（见 docs/m3-plan.md §五）。
      # 因此 `error CP****` 表示公开 API 被破坏性修改，**不是打包故障**：
      # 要么改回兼容形状，要么按 scripts/update-api-baseline.sh 更新基线并在
      # CHANGELOG.md 记录。
      - name: Pack (packaging + API compatibility)
        run: dotnet pack Dougong.slnx -c Release --no-build -o artifacts/packages

      # 基线缺失时不让它悄悄变成"无基线=不校验"。
      - name: Verify API baselines exist
        run: |
          for pkg in Dougong.Kernel Dougong.Agent; do
            test -f "artifacts/baseline/$pkg.nupkg" || { echo "缺少基线：artifacts/baseline/$pkg.nupkg（见 scripts/update-api-baseline.sh）" >&2; exit 1; }
          done

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: ignore
