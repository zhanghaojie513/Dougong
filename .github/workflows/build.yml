name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    # I0 的退出条件写的是"在干净 Windows 与 Linux 环境各完成一次"。
    # 此前只在 windows-latest 上跑，Linux 从未验证过——这是 I0 能否关闭的
    # 实际判据，不是加分项。两个平台跑同一套 scripts/all-checks.sh，
    # 保证检查内容不因平台分叉。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          # 与 global.json 一致；那里固定了 SDK 版本并启用 Microsoft.Testing.Platform 运行器。
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore Dougong.slnx

      # 刻意走 scripts/all-checks.sh 而不是在这里重写一遍命令：
      # 此前 CI 只跑内核测试与 pack，**32 个自检套件从未在 CI 上跑过**。
      # 结果就是本地全绿、CI 红——而且漏掉的正是覆盖协议、会话、
      # 审批、资源锁的那一大半检查。两套流程必然漂移，只留一套。
      - name: Full self-check (build + tests + API compat + all suites)
        shell: bash
        run: bash scripts/all-checks.sh

      # 最终产物单独打一次到 artifacts/packages 供上传。
      # 注意：API 兼容检查已在上一版的 pack 中执行过（all-checks.sh 里），
      # 这里只用 --no-build 产出上传用的包。
      - name: Pack artifacts for upload
        run: dotnet pack Dougong.slnx -c Release --no-build -o artifacts/packages

      # 基线缺失时不让它悄悄变成"无基线=不校验"。
      #
      # 用 shell: bash 而不是 PowerShell，因为这一步现在要在两个平台上跑。
      # 历史教训：先前这里写过 `for pkg in ...; do`（bash 语法）却让
      # windows-latest 用默认 pwsh 执行，CI 直接 ParserError，本地 Git Bash 测不出来。
      # 现在显式声明 shell，并由 matrix 保证同一份脚本在两处都成立。
      - name: Verify API baselines exist
        shell: bash
        run: |
          missing=0
          # 这份列表必须与 scripts/update-api-baseline.sh 的 PACKAGES 一致。
          # 漏一个不会报错，只会让那个包**悄悄地没有基线保护**——
          # 而那正是这道检查要防的事。
          for pkg in Dougong.Kernel Dougong.Agent Dougong.Hosting Dougong.Ai Dougong.Mcp Dougong.Acp Dougong.HostProtocol; do
            path="artifacts/baseline/$pkg.nupkg"
            if [ ! -f "$path" ]; then
              echo "::error::缺少基线：$path（见 scripts/update-api-baseline.sh）"
              missing=1
            else
              echo "  基线存在：$path"
            fi
          done
          exit $missing

      # 失败时把自检的诊断落盘文件带出来。
      # 没有这个，失败详情只存在于 CI 的临时目录里，而日志又被
      # 汇总行与 300 字符截断——2026-10-31 查 ubuntu 上的 doctor 失败时，
      # 就是这样卡住了一轮。
      - name: Upload self-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            /tmp/dougong-doctor-*.txt
            ${{ runner.temp }}/dougong-doctor-*.txt
          if-no-files-found: ignore

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # 两个平台都会产出包，名字必须区分，否则 CI 报 artifact 冲突。
          name: packages-${{ matrix.os }}
          path: artifacts/packages
          if-no-files-found: ignore
