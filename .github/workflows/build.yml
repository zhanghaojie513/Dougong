name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 与 global.json 一致；那里固定了 SDK 版本并启用 Microsoft.Testing.Platform 运行器。
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore Dougong.slnx

      # 刻意走 scripts/all-checks.sh 而不是在这里重写一遍命令：
      # 此前 CI 只跑内核测试与 pack，**32 个自检套件从未在 CI 上跑过**。
      # 结果就是本地全绿、CI 红——而且漏掉的正是覆盖协议、会话、
      # 审批、资源锁的那一大半检查。两套流程必然漂移，只留一套。
      - name: Full self-check (build + tests + API compat + all suites)
        shell: bash
        run: bash scripts/all-checks.sh

      # 最终产物单独打一次到 artifacts/packages 供上传。
      # 注意：API 兼容检查已在上一版的 pack 中执行过（all-checks.sh 里），
      # 这里只用 --no-build 产出上传用的包。
      - name: Pack artifacts for upload
        run: dotnet pack Dougong.slnx -c Release --no-build -o artifacts/packages

      # 基线缺失时不让它悄悄变成"无基线=不校验"。
      #
      # 用 PowerShell 语法而不是 bash：runner 是 windows-latest，
      # 默认 shell 是 pwsh。先前写了 `for pkg in ...; do` 这种 bash 语法，
      # CI 直接 ParserError 失败——而本地是 Git Bash，测不出来。
      # 若要写 bash，必须显式 `shell: bash`。
      - name: Verify API baselines exist
        shell: pwsh
        run: |
          foreach ($pkg in @('Dougong.Kernel', 'Dougong.Agent')) {
            $path = "artifacts/baseline/$pkg.nupkg"
            if (-not (Test-Path $path)) {
              Write-Error "缺少基线：$path（见 scripts/update-api-baseline.sh）"
              exit 1
            }
            Write-Host "  基线存在：$path"
          }

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: ignore
